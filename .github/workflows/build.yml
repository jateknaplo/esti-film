name: Esti film

on:
  schedule:
    # A cron UTC-ben fut, és a GitHub az egész órás időzítéseket gyakran 1-5 órát késlelteti.
    # Ezért óra:17-kor indul, és mind a hat időpont lefut (publikus repóban az Actions ingyenes):
    #   télen (CET)  06:17, 07:17, 13:17, 14:17, 18:17, 19:17 Budapest
    #   nyáron (CEST) 07:17, 08:17, 14:17, 15:17, 19:17, 20:17 Budapest
    - cron: "17 5,6,12,13,17,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: esti-film
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # a napi műsoroldalak cache-e (nem kerül a repóba)
      - uses: actions/cache@v4
        with:
          path: cache/schedule
          key: schedule-${{ github.run_id }}
          restore-keys: schedule-

      - name: Magyar címindex (havonta újraépül)
        run: python scripts/imdb_data.py --if-older 30

      - name: Oldal generálása
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ESTI_FORRAS: port
          WATCHLIST_IDS: ${{ secrets.WATCHLIST_IDS }}
        run: python scripts/build.py

      - name: Párosítások mentése a repóba
        run: |
          git config user.name "esti-film bot"
          git config user.email "actions@users.noreply.github.com"
          git add cache/matches.json cache/hu_index.json.gz cache/hu_index.json.gz.date
          if git diff --cached --quiet; then
            echo "nincs változás"
          else
            git commit -m "Párosítások frissítése [skip ci]"
            git pull --rebase && git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # a kitétel néha átmeneti GitHub-hiba miatt elbukik ("Fetching artifact metadata failed"):
      # egy perc múlva még egyszer megpróbáljuk
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
