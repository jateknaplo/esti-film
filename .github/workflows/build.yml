name: Esti film

on:
  schedule:
    # A cron UTC-ben fut. 14:00 és 19:00 Budapesten:
    #   nyári idő (CEST, UTC+2): 12:00 és 17:00 UTC
    #   téli idő  (CET,  UTC+1): 13:00 és 18:00 UTC
    # Mind a négy elindul, a "gate" job csak az aktuális időszámításnak megfelelőt engedi tovább.
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
    - cron: "0 13 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: esti-film
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          run=yes
          if [ "${{ github.event_name }}" = "schedule" ]; then
            off=$(TZ=Europe/Budapest date +%z)
            case "${{ github.event.schedule }}" in
              "0 12 * * *"|"0 17 * * *") want=+0200 ;;
              *) want=+0100 ;;
            esac
            [ "$off" = "$want" ] || run=no
            echo "Budapest: $off, ez a cron ehhez: $want -> $run"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # a napi műsoroldalak cache-e (nem kerül a repóba)
      - uses: actions/cache@v4
        with:
          path: cache/schedule
          key: schedule-${{ github.run_id }}
          restore-keys: schedule-

      - name: Magyar címindex (havonta újraépül)
        run: python scripts/imdb_data.py --if-older 30

      - name: Oldal generálása
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/build.py

      - name: Párosítások mentése a repóba
        run: |
          git config user.name "esti-film bot"
          git config user.email "actions@users.noreply.github.com"
          git add cache/matches.json cache/hu_index.json.gz cache/hu_index.json.gz.date
          if git diff --cached --quiet; then
            echo "nincs változás"
          else
            git commit -m "Párosítások frissítése [skip ci]"
            git pull --rebase && git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
