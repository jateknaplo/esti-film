name: Esti film

on:
  schedule:
    # A cron UTC-ben fut. 07:00, 14:00 és 19:00 Budapesten:
    #   nyári idő (CEST, UTC+2): 05, 12, 17 UTC
    #   téli idő  (CET,  UTC+1): 06, 13, 18 UTC
    # Mind a hat elindul, a "gate" job csak az aktuális időszámításnak megfelelőt engedi tovább.
    - cron: "0 5 * * *"
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
    - cron: "0 6 * * *"
    - cron: "0 13 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esti-film
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          run=yes
          if [ "${{ github.event_name }}" = "schedule" ]; then
            off=$(TZ=Europe/Budapest date +%z)
            case "${{ github.event.schedule }}" in
              "0 5 * * *"|"0 12 * * *"|"0 17 * * *") want=+0200 ;;
              *) want=+0100 ;;
            esac
            [ "$off" = "$want" ] || run=no
            echo "Budapest: $off, ez a cron ehhez: $want -> $run"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # a napi műsoroldalak cache-e (nem kerül a repóba)
      - uses: actions/cache@v4
        with:
          path: cache/schedule
          key: schedule-${{ github.run_id }}
          restore-keys: schedule-

      - name: Magyar címindex (havonta újraépül)
        run: python scripts/imdb_data.py --if-older 30

      - name: Oldal generálása
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/build.py

      - name: Kitétel a Cloudflare Pagesre
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: be80fd4e0b9462ed287430a87b1fbeaf
        run: |
          npm ci --no-audit --no-fund
          npx wrangler pages deploy site --project-name esti-film --branch main --commit-dirty=true

      - name: Párosítások mentése a repóba
        run: |
          git config user.name "esti-film bot"
          git config user.email "actions@users.noreply.github.com"
          git add cache/matches.json cache/hu_index.json.gz cache/hu_index.json.gz.date
          if git diff --cached --quiet; then
            echo "nincs változás"
          else
            git commit -m "Párosítások frissítése [skip ci]"
            git pull --rebase && git push
          fi
